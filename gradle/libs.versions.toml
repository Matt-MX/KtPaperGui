[versions]

paperweight = "1.7.1"
kotlin = "2.0.0"
updateVersions = "0.51.0"
shadow = "8.1.8"
runPaper = "2.2.4"
runVelocity = "2.2.4"

paperApi = "1.21.1-R0.1-SNAPSHOT"

brigadier = "1.0.18"
placeholderapi = "2.11.6"
protocolLib = "5.1.0"
adventure = "4.17.0"
packetEvents = "2.6.0"
velocity = "3.4.0-SNAPSHOT"
gson = "2.11.0"

[libraries]

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
mojang-brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
placeholder-api = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
packet-events-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetEvents" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity"}
packet-events-api = { module = "com.github.retrooper:packetevents-api", version.ref = "packetEvents" }
kotlinx-coroutines-reactive = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-reactive", version = "1.10.2" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]

kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
updateDeps = { id = "com.github.ben-manes.versions", version.ref = "updateVersions" }
shadow = { id = "io.github.goooler.shadow", version.ref = "shadow" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
runVelocity = { id = "xyz.jpenilla.run-velocity", version.ref = "runVelocity" }
